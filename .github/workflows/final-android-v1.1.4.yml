name: Final E-SISWA Android v1.1.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/final-android-v1.1.4.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.1.3 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35056974501

      - name: Prepare v1.1.4 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='base-artifact/E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip'
          PATCH='revision-assets/v1.1.4-webview-camera.patch'
          test -s "$BASE"
          test -s "$PATCH"
          echo '4e36cfff23cbfb145b03006a48d29cb48afbd1c464641351bc6671789a3306d2  base-artifact/E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip' | sha256sum -c -
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          cd project
          patch -p1 < ../"$PATCH"
          python3 tools/test_v114_webview_camera.py
          python3 tools/test_v112_permissions.py
          python3 tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='6' versionName='1.1.4'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../E-SISWA-SSD-Android-v1.1.4-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-SSD-Android-v1.1.4-SOURCE-CI.zip >/dev/null
          sha256sum E-SISWA-SSD-Android-v1.1.4-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.4-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.4-FINAL-SOURCE
          path: |
            E-SISWA-SSD-Android-v1.1.4-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
