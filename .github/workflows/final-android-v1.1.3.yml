name: Final E-SISWA Android v1.1.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/final-android-v1.1.3.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.1.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35053006524

      - name: Prepare v1.1.3 source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='base-artifact/E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip'
          test -s "$BASE"
          echo '828a9fe51987e06349a60805b05a55b5beb779bb53ec08925f61a0d72accd4dc  base-artifact/E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip' | sha256sum -c -
          rm -rf project v113.patch
          mkdir project
          unzip -q "$BASE" -d project

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/haryadi886/E-SISWA-SSD-/git/blobs/526ec9c67e8f46cf3f8d097e264ad039b264a99b' \
            | python3 -c "import sys,json,base64; d=json.load(sys.stdin); sys.stdout.buffer.write(base64.b64decode(d['content']))" \
            > v113.patch
          echo '336116a1f7c7a3c3018fd5400fd36a93045fb8d3e24afe65e7eb396b5f9a82f8  v113.patch' | sha256sum -c -
          cd project
          patch -p1 < ../v113.patch

          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('app/src/main/res/drawable-nodpi/esiswa_logo.webp')
          im=Image.open(p).convert('RGB')
          px=im.load(); w,h=im.size
          for y in range(h):
              for x in range(w):
                  r,g,b=px[x,y]
                  if max(r,g,b) < 45:
                      px[x,y]=(255,255,255)
          im.save(p,'WEBP',quality=92,method=6)
          check=Image.open(p).convert('RGB')
          assert check.size == (512,512), check.size
          corners=[check.getpixel((0,0)),check.getpixel((511,0)),check.getpixel((0,511)),check.getpixel((511,511))]
          assert all(min(c) > 235 for c in corners), corners
          print('ICON PASS:', check.size, corners)
          PY

          python3 tools/test_v113_ui.py
          python3 tools/test_v112_permissions.py
          python3 tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='5' versionName='1.1.3'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip >/dev/null
          sha256sum E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3-FINAL-SOURCE
          path: |
            E-SISWA-SSD-Android-v1.1.3-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
