name: Build E-SISWA Android v1.1.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android-v1.1.0.yml'
      - 'source-binary/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified source ZIP
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="1ad52bdab2bca8a90d517e29978b2d1d2dce2c921985fd6fa2fff4d687b19ce5"
          rm -rf project source.zip
          cat source-binary/part*.bin > source.zip
          echo "$EXPECTED_SHA  source.zip" | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project
          test -f project/app/build.gradle
          test -f project/tools/verify_project.py
          grep -q '^android.useAndroidX=true$' project/gradle.properties || echo 'android.useAndroidX=true' >> project/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project/app/build.gradle')
          s = p.read_text()
          if 'buildConfig true' not in s:
              marker = '    compileOptions {'
              block = '    buildFeatures {\n        buildConfig true\n    }\n\n'
              if marker not in s:
                  raise SystemExit('compileOptions marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          PY
          grep '^android.useAndroidX=true$' project/gradle.properties
          grep -A2 'buildFeatures' project/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.0-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
