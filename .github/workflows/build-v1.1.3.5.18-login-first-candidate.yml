name: Build E-SISWA R7 v1.1.3.5.18 Login-First Candidate APK

on:
  push:
    branches:
      - 'build/v1.1.3.5.18-login-first-candidate'
    paths:
      - '.github/workflows/build-v1.1.3.5.18-login-first-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5.17 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.17-C1.5.3.2-R6-APK-UJI
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 39098597752

      - name: Apply isolated Login-System-first candidate delta
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.17-C1.5.3.2-R6-NATIVE-SHELL-SOURCE.zip' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          mkdir project
          unzip -q "$SRC" -d project
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          gradle = Path('project/app/build.gradle')
          s = gradle.read_text()
          assert s.count('versionCode 27') == 1, 'Expected v1.1.3.5.17 versionCode'
          assert s.count("versionName '1.1.3.5.17'") == 1, 'Expected v1.1.3.5.17 versionName'
          s = s.replace('versionCode 27', 'versionCode 28', 1)
          s = s.replace("versionName '1.1.3.5.17'", "versionName '1.1.3.5.18'", 1)
          gradle.write_text(s)

          java = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s = java.read_text()
          old_url = 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbyakrD5CIbaeZm7GH3jwn2ZGrpA_DBq6HYkOqLUaNI-g18L4GBzMctYVSYM7f9O7ZCzkQ/exec'
          new_url = old_url + '?page=login'
          assert s.count(old_url) == 1, 'Expected verified v1.1.3.5.17 deployment URL exactly once'
          s = s.replace(old_url, new_url, 1)
          assert "view:'notification_center'" in s, 'Notification Center routing baseline missing'
          java.write_text(s)

          service = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java').read_text()
          manifest = Path('project/app/src/main/AndroidManifest.xml').read_text()
          icon = Path('project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png')
          assert 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' in service
          assert 'android:resource="@drawable/esiswa_notification_monochrome"' in manifest
          assert icon.is_file() and icon.stat().st_size > 0
          assert new_url in java.read_text()
          print('PASS: version 1.1.3.5.18 / code 28')
          print('PASS: candidate starts with ?page=login parameter')
          print('PASS: notification routing and monochrome icon preserved')
          print('MainActivity SHA-256:', hashlib.sha256(java.read_bytes()).hexdigest())
          PY

      - name: Verify source contract and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F 'versionCode 28' project/app/build.gradle
          grep -F "versionName '1.1.3.5.18'" project/app/build.gradle
          grep -F '?page=login' project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "view:'notification_center'" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/esiswa_notification_monochrome"' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/app/src/main/AndroidManifest.xml')
          print('PASS: Android manifest XML parses')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity, integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='28' versionName='1.1.3.5.18'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" E-SISWA-R7-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-APK-UJI.apk
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-SOURCE.zip | tee source-sha256.txt
          printf '%s\n' 'Base: v1.1.3.5.17 C1.5.3.2 R6 native shell.' > LOGIN-FIRST-CANDIDATE-NOTES.txt
          printf '%s\n' 'Start URL appends ?page=login. Build checks do not prove that the deployed Apps Script recognizes this parameter; confirm the first screen on-device before treating as final.' >> LOGIN-FIRST-CANDIDATE-NOTES.txt

      - name: Upload candidate APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-APK-UJI
          path: |
            E-SISWA-R7-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-APK-UJI.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            E-SISWA-R7-ANDROID-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-SOURCE.zip
            source-sha256.txt
            LOGIN-FIRST-CANDIDATE-NOTES.txt
          if-no-files-found: error
          retention-days: 30
