name: Build E-SISWA Android v1.1.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android-v1.1.2.yml'
      - 'source-binary/**'
      - 'revision-assets/v1.1.1/**'
      - 'revision-assets/v1.1.2/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified base and apply v1.1.2
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="1ad52bdab2bca8a90d517e29978b2d1d2dce2c921985fd6fa2fff4d687b19ce5"
          LOGO_SHA="2bdad684be125295f1cc59d45a8ba14d8bd7cd3522b279d94304e15a768ccad3"
          LAUNCH_SHA="571e8d54ccb0f02f41d228d33cb65314dd7785f9dba56bb1f0834f32bb13353b"

          rm -rf project source.zip
          cat source-binary/part*.bin > source.zip
          echo "$BASE_SHA  source.zip" | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project
          cd project

          patch -p1 < ../revision-assets/v1.1.1/source.patch
          grep -q '^android.useAndroidX=true$' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties

          mkdir -p app/src/main/res/drawable-nodpi
          cat ../revision-assets/v1.1.1/logo.*.b64 | tr -d '\n\r' | base64 -d > app/src/main/res/drawable-nodpi/esiswa_logo.webp
          echo "$LOGO_SHA  app/src/main/res/drawable-nodpi/esiswa_logo.webp" | sha256sum -c -

          cat > ../launch-sha256.txt <<'EOF'
          6585c1afd039f53a281ae8e02e6ff26fce5d4e8dbe1fc1bc823452d16422237d  revision-assets/v1.1.2/launch.00.b64
          eb22f99f7b01165e7a5e4a216391effae4906b737a2dc8e7cddc9629352494bd  revision-assets/v1.1.2/launch.01.b64
          b5770b316407ccab7fe10c63bbf3ab4f582d494af3c43b2a7316084b17eb4928  revision-assets/v1.1.2/launch.02.b64
          564da5cdac269c535253a580a6159f73b7a5d515d3f2bfbc29fa17f4eca48296  revision-assets/v1.1.2/launch.03.b64
          5ea8d2b4710f0ee76809f1f8881ac01ee0a5bb30b781457d0f19a8e6d75ffce8  revision-assets/v1.1.2/launch.04.b64
          1b1abb1c280873dbc27be6b6562581946137438e4e3e45a1fd553d2ee17151de  revision-assets/v1.1.2/launch.05.b64
          EOF
          sed -i 's/^          //' ../launch-sha256.txt
          cd ..
          sha256sum -c launch-sha256.txt
          cd project
          cat ../revision-assets/v1.1.2/launch.*.b64 | tr -d '\n\r' | base64 -d > app/src/main/res/drawable-nodpi/launch_screen.jpg
          echo "$LAUNCH_SHA  app/src/main/res/drawable-nodpi/launch_screen.jpg" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle')
          s = build.read_text()
          assert "versionCode 3" in s and "versionName '1.1.1'" in s
          s = s.replace('versionCode 3', 'versionCode 4', 1).replace("versionName '1.1.1'", "versionName '1.1.2'", 1)
          build.write_text(s)

          p = Path('app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s = p.read_text()
          old = 'import android.app.Activity;\nimport android.app.Dialog;'
          assert old in s
          s = s.replace(old, 'import android.app.Activity;\nimport android.app.AlertDialog;\nimport android.app.Dialog;', 1)

          old_host = '                || host.endsWith(".script.googleusercontent.com");'
          assert s.count(old_host) == 2, s.count(old_host)
          s = s.replace(old_host, '                || host.endsWith(".script.googleusercontent.com")\n                || host.endsWith("-script.googleusercontent.com");')

          marker = '    private void refreshFcmToken() {'
          assert marker in s
          dialog = '''    private void showPermissionSettingsDialog(String title, String message) {\n        if (isFinishing()) return;\n        new AlertDialog.Builder(this)\n                .setTitle(title)\n                .setMessage(message)\n                .setNegativeButton("Nanti", null)\n                .setPositiveButton("Buka Pengaturan", (dialog, which) -> {\n                    try {\n                        Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);\n                        intent.setData(Uri.parse("package:" + getPackageName()));\n                        startActivity(intent);\n                    } catch (Exception ignored) {\n                        toast("Pengaturan aplikasi tidak dapat dibuka.");\n                    }\n                })\n                .show();\n    }\n\n'''
          s = s.replace(marker, dialog + marker, 1)

          old_cam = '''                } else {\n                    req.deny();\n                    toast("Izin kamera diperlukan untuk QR/Face Recognition.");\n                }\n'''
          new_cam = '''                } else {\n                    req.deny();\n                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M\n                            && !shouldShowRequestPermissionRationale(Manifest.permission.CAMERA)) {\n                        showPermissionSettingsDialog(\n                                "Izin Kamera Diperlukan",\n                                "Aktifkan izin Kamera untuk E-SISWA agar Scan QR, Face Recognition, foto profil guru, dan foto siswa dapat digunakan."\n                        );\n                    } else {\n                        toast("Izin kamera diperlukan. Tekan Coba Lagi lalu pilih Izinkan.");\n                    }\n                }\n'''
          assert old_cam in s
          s = s.replace(old_cam, new_cam, 1)

          old_notif = '''        } else if (requestCode == REQ_NOTIFICATIONS) {\n            if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n                toast("Notifikasi Android dinonaktifkan. Anda dapat mengaktifkannya dari Pengaturan aplikasi.");\n            } else {\n                refreshFcmToken();\n            }\n'''
          new_notif = '''        } else if (requestCode == REQ_NOTIFICATIONS) {\n            if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n                if (Build.VERSION.SDK_INT >= 33\n                        && !shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)) {\n                    showPermissionSettingsDialog(\n                            "Izin Notifikasi Diperlukan",\n                            "Aktifkan notifikasi E-SISWA agar pemberitahuan Pembinaan dan Absensi Masuk/Pulang dapat diterima di perangkat ini."\n                    );\n                } else {\n                    toast("Notifikasi belum diizinkan. Izin dapat diberikan saat diminta kembali.");\n                }\n            } else {\n                refreshFcmToken();\n            }\n'''
          assert old_notif in s
          s = s.replace(old_notif, new_notif, 1)
          p.write_text(s)

          verify = Path('tools/verify_project.py')
          v = verify.read_text()
          v = v.replace("versionName '1.1.1'", "versionName '1.1.2'")
          v = v.replace('v1.1.1 project contract satisfied', 'v1.1.2 project contract satisfied')
          verify.write_text(v)

          test = Path('tools/test_v112_permissions.py')
          test.write_text('''from pathlib import Path\nimport sys\nroot=Path(__file__).resolve().parents[1]\nmain=(root/'app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java').read_text()\nmanifest=(root/'app/src/main/AndroidManifest.xml').read_text()\nbuild=(root/'app/build.gradle').read_text()\nchecks={\n'Version 1.1.2': "versionName '1.1.2'" in build and 'versionCode 4' in build,\n'Camera manifest permission': 'android.permission.CAMERA' in manifest,\n'Notification manifest permission': 'android.permission.POST_NOTIFICATIONS' in manifest,\n'Apps Script sandbox origin': 'host.endsWith("-script.googleusercontent.com")' in main,\n'Notification runtime request': 'requestNotificationPermissionIfNeeded();' in main,\n'Camera runtime request': 'requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA)' in main,\n'Settings recovery': 'showPermissionSettingsDialog' in main and 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' in main,\n'Camera rationale handling': 'shouldShowRequestPermissionRationale(Manifest.permission.CAMERA)' in main,\n'Notification rationale handling': 'shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)' in main,\n'Video-only WebView grant': 'request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE})' in main,\n'No microphone grant': 'RESOURCE_AUDIO_CAPTURE' not in main,\n}\nfor k,v in checks.items(): print(('PASS' if v else 'FAIL')+' - '+k)\nfailed=[k for k,v in checks.items() if not v]\nif failed: sys.exit(1)\nprint(f'PASS {len(checks)}/{len(checks)} checks')\n''')
          PY

          grep -q "versionName '1.1.2'" app/build.gradle
          grep -q 'host.endsWith("-script.googleusercontent.com")' app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -q 'showPermissionSettingsDialog' app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run permission regression tests
        working-directory: project
        run: python3 tools/test_v112_permissions.py

      - name: Verify project contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity, signing and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$AAPT" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='4' versionName='1.1.2'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip >/dev/null
          sha256sum E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-source
          path: |
            E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
