name: Google Play AAB v1.1.3.5.2 (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ feature/google-play-ready-v11352 ]
    paths:
      - '.github/workflows/google-play-aab-v1.1.3.5.2.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.2-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35403169464

      - name: Extract verified source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(find base-artifact -type f -name '*.zip' | head -n 1)"
          test -n "$BASE" && test -s "$BASE"
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F "targetSdk 36" project/app/build.gradle
          grep -F "versionCode 12" project/app/build.gradle
          grep -F "versionName '1.1.3.5.2'" project/app/build.gradle

      - name: Run project regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 tools/test_v11352_print_lightweight.py
          python3 tools/test_v11351_branding.py
          python3 tools/test_v112_permissions.py
          python3 tools/test_v113_ui.py
          python3 tools/test_v1131_camera_print.py
          python3 tools/test_v1132_native_print_v2.py
          python3 tools/test_v1133_student_print_notifications.py
          python3 tools/test_v1134_push_diagnostics.py
          python3 tools/test_v1135_print_state.py
          python3 tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release AAB
        working-directory: project
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB" | tee aab-unsigned-sha256.txt
          cp "$AAB" SSD-SMPN4D-v1.1.3.5.2-PLAY-UNSIGNED.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.2-PLAY-UNSIGNED-AAB
          path: |
            SSD-SMPN4D-v1.1.3.5.2-PLAY-UNSIGNED.aab
            aab-unsigned-sha256.txt
          if-no-files-found: error
          retention-days: 7
