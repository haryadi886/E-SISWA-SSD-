name: Build E-SISWA R7 Android v1.1.3.5.12 Patch B

on:
  workflow_dispatch:
  push:
    branches: [ feature/r7-v113512-popup-dedupe, fix/r7-v113512-c15-mon98-badge-rc2-candidate ]
    paths:
      - '.github/workflows/build-r7-v1.1.3.5.12-popup-dedupe.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5.11 baseline
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.11-BALANCED-ICON-BUILD
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 36675406370

      - name: Extract and verify baseline
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.11-SOURCE.zip' | head -n 1)"
          test -n "$SRC" && test -s "$SRC"
          mkdir project
          unzip -q "$SRC" -d project
          grep -F "versionCode 21" project/app/build.gradle
          grep -F "versionName '1.1.3.5.11'" project/app/build.gradle
          grep -F 'setNumber(1)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          find project/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > baseline-production.sha256

      - name: Apply Patch B
        run: python3 tools/apply_v113512_patch.py

      - name: Verify production source scope
        shell: bash
        run: |
          set -euo pipefail
          find project/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > candidate-production.sha256
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  h, p = line.split(None, 1)
                  result[p.strip()] = h
              return result
          before, after = read("baseline-production.sha256"), read("candidate-production.sha256")
          changed = sorted(p for p in set(before) | set(after) if before.get(p) != after.get(p))
          print("Changed production source files:", changed)
          allowed = {\n              "project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java",\n              "project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java",\n              "project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png",\n          }
          if set(changed) != allowed:
              raise SystemExit("Unexpected production source changes: " + repr(changed))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: project
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          DBG=project/app/build/outputs/apk/debug/app-debug.apk
          REL=project/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$DBG" && test -s "$REL" && test -s "$AAB"
          unzip -t "$DBG" >/dev/null
          unzip -t "$REL" >/dev/null
          unzip -t "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DBG" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='22' versionName='1.1.3.5.12'" apk-badging.txt\n          unzip -Z1 "$DBG" | grep -E "^res/drawable-nodpi(-v[0-9]+)?/esiswa_notification_monochrome\\.png$"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DBG" | tee debug-apk-signature.txt
          cp "$DBG" E-SISWA-R7-v1.1.3.5.12-PATCH-B-MONO98-BADGE-CANDIDATE-APK-UJI.apk
          cp "$REL" E-SISWA-R7-v1.1.3.5.12-PATCH-B-MONO98-BADGE-CANDIDATE-RELEASE-UNSIGNED.apk
          cp "$AAB" E-SISWA-R7-v1.1.3.5.12-PATCH-B-MONO98-BADGE-CANDIDATE-PLAY-UNSIGNED.aab
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.12-PATCH-B-MONO98-BADGE-CANDIDATE-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-v1.1.3.5.12-PATCH-B-APK-UJI.apk E-SISWA-R7-v1.1.3.5.12-RELEASE-UNSIGNED.apk E-SISWA-R7-v1.1.3.5.12-PLAY-UNSIGNED.aab E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip | tee SHA256-v113512.txt

      - name: Upload Patch B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.12-PATCH-B-MONO98-BADGE-CANDIDATE-BUILD
          path: |
            E-SISWA-R7-v1.1.3.5.12-PATCH-B-APK-UJI.apk
            E-SISWA-R7-v1.1.3.5.12-RELEASE-UNSIGNED.apk
            E-SISWA-R7-v1.1.3.5.12-PLAY-UNSIGNED.aab
            E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip
            apk-badging.txt
            debug-apk-signature.txt
            SHA256-v113512.txt
          if-no-files-found: error
          retention-days: 30
