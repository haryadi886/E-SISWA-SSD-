name: Build E-SISWA Android v1.1.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source-parts/**'
      - '.github/workflows/build-android-v1.1.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source package
        run: |
          cat source-parts/source.b64.part* | base64 -d > source.zip
          echo "52fcb3d00d62c620de9cb368600607b7e571664e2adfc72a3eaf29efe5d8fc4d  source.zip" | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.0-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
