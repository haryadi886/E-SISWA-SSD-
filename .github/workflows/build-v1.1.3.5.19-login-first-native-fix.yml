name: Build E-SISWA R7 v1.1.3.5.19 Login-First Native Fix APK

on:
  push:
    branches:
      - 'build/v1.1.3.5.19-login-first-native-fix'
    paths:
      - '.github/workflows/build-v1.1.3.5.19-login-first-native-fix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4

      - name: Download v1.1.3.5.18 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-APK-UJI
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 39101477607

      - name: Apply native Login-System-first correction
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.18-LOGIN-FIRST-CANDIDATE-SOURCE.zip' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          mkdir project
          unzip -q "$SRC" -d project
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          gradle = Path('project/app/build.gradle')
          s = gradle.read_text()
          assert s.count('versionCode 28') == 1, 'Expected v1.1.3.5.18 versionCode'
          assert s.count("versionName '1.1.3.5.18'") == 1, 'Expected v1.1.3.5.18 versionName'
          s = s.replace('versionCode 28', 'versionCode 29', 1)
          s = s.replace("versionName '1.1.3.5.18'", "versionName '1.1.3.5.19'", 1)
          gradle.write_text(s)

          java = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s = java.read_text()
          old = """            if (view == webView) {
                  deliverCachedFcmTokenToPage();
                  deliverPendingPushOpenToPage();
              }"""
          new = """            if (view == webView) {
                  enforceLoginSystemFirst(view);
                  deliverCachedFcmTokenToPage();
                  deliverPendingPushOpenToPage();
              }"""
          assert s.count(old) == 1, 'Expected main WebView onPageFinished hook not found exactly once'
          s = s.replace(old, new, 1)
          anchor = '    private class ESiswaChromeClient extends WebChromeClient {'
          method = r'''    // v1.1.3.5.19: the web runtime intentionally selects the Alumni tab after 120 ms.
    // Re-assert Login Sistem in the first page load, then stop once the login panel is active.
    private void enforceLoginSystemFirst(WebView target) {
        if (target == null) return;
        String js = "(function(){try{"
                + "if(window.__esiswaLoginFirstDone||window.__esiswaLoginFirstTimer)return;"
                + "var n=0;"
                + "function forceLogin(){"
                + "n++;"
                + "try{"
                + "if(typeof window.switchLandingTabR5345==='function'&&document.getElementById('loginSystemPanelR5345')){"
                + "window.switchLandingTabR5345('login');"
                + "var p=document.getElementById('loginSystemPanelR5345');"
                + "var a=document.getElementById('albumAlumniPanelR5345');"
                + "if(p&&!p.classList.contains('hidden')&&(!a||a.classList.contains('hidden'))){"
                + "window.__esiswaLoginFirstDone=true;"
                + "if(window.__esiswaLoginFirstTimer){clearInterval(window.__esiswaLoginFirstTimer);window.__esiswaLoginFirstTimer=null;}"
                + "return;"
                + "}"
                + "}"
                + "}catch(e){}"
                + "if(n>=40){if(window.__esiswaLoginFirstTimer){clearInterval(window.__esiswaLoginFirstTimer);window.__esiswaLoginFirstTimer=null;}}"
                + "}"
                + "window.__esiswaLoginFirstTimer=setInterval(forceLogin,100);"
                + "forceLogin();"
                + "}catch(e){}})();";
        target.evaluateJavascript(js, null);
    }

'''
          assert s.count(anchor) == 1, 'Expected ChromeClient insertion point not found exactly once'
          s = s.replace(anchor, method + anchor, 1)
          java.write_text(s)

          assert "versionCode 29" in gradle.read_text()
          assert "versionName '1.1.3.5.19'" in gradle.read_text()
          assert 'enforceLoginSystemFirst(view);' in java.read_text()
          assert 'switchLandingTabR5345' in java.read_text()
          assert 'view:\'notification_center\'' in java.read_text()
          service = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java').read_text()
          manifest = Path('project/app/src/main/AndroidManifest.xml').read_text()
          icon = Path('project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png')
          assert 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' in service
          assert 'android:resource="@drawable/esiswa_notification_monochrome"' in manifest
          assert icon.is_file() and icon.stat().st_size > 0
          print('PASS: v1.1.3.5.19 metadata and Login-System-first native enforcement')
          print('MainActivity SHA-256:', hashlib.sha256(java.read_bytes()).hexdigest())
          PY

      - name: Verify source contract and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F 'versionCode 29' project/app/build.gradle
          grep -F "versionName '1.1.3.5.19'" project/app/build.gradle
          grep -F 'enforceLoginSystemFirst(view);' project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "switchLandingTabR5345" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "view:'notification_center'" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/esiswa_notification_monochrome"' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/app/src/main/AndroidManifest.xml')
          print('PASS: Android manifest XML parses')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity, integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='29' versionName='1.1.3.5.19'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" E-SISWA-R7-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-APK-UJI.apk
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-SOURCE.zip | tee source-sha256.txt
          printf '%s\n' 'Base: v1.1.3.5.18 candidate source.' > LOGIN-FIRST-NATIVE-FIX-NOTES.txt
          printf '%s\n' 'Native WebView calls switchLandingTabR5345("login") repeatedly during initial page load until Login Sistem panel is active; the 120 ms web-runtime default Album tab is thereby overridden. On-device first-screen verification is still required.' >> LOGIN-FIRST-NATIVE-FIX-NOTES.txt

      - name: Upload candidate APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-APK-UJI
          path: |
            E-SISWA-R7-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-APK-UJI.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            E-SISWA-R7-ANDROID-v1.1.3.5.19-LOGIN-FIRST-NATIVE-FIX-SOURCE.zip
            source-sha256.txt
            LOGIN-FIRST-NATIVE-FIX-NOTES.txt
          if-no-files-found: error
          retention-days: 30
