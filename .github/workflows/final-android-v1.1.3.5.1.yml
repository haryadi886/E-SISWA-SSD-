name: Final (SSD) SMPN4D Android v1.1.3.5.1

on:
  workflow_dispatch:
  push:
    branches: [ v1.1.3.5.1-branding ]
    paths:
      - '.github/workflows/final-android-v1.1.3.5.1.yml'
      - 'ci/apply-v1.1.3.5.1-branding.py'
      - 'ci/branding/logo.b64.part00'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3.5-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35200944023

      - name: Prepare branded v1.1.3.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(find base-artifact -type f -name '*.zip' | head -n 1)"
          test -n "$BASE" && test -s "$BASE"
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          python3 ci/apply-v1.1.3.5.1-branding.py project ci/branding/logo.b64.part00
          cd project
          python3 tools/test_v11351_branding.py
          python3 tools/test_v112_permissions.py
          python3 tools/test_v113_ui.py
          python3 tools/test_v1131_camera_print.py
          python3 tools/test_v1132_native_print_v2.py
          python3 tools/test_v1133_student_print_notifications.py
          python3 tools/test_v1134_push_diagnostics.py
          python3 tools/test_v1135_print_state.py
          rm -rf tools/__pycache__
          python3 tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='11' versionName='1.1.3.5.1'"
          echo "$BADGING" | grep -F "application-label:'(SSD) SMPN4D'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*' 'tools/__pycache__/*'
          cd ..
          unzip -t SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip >/dev/null
          sha256sum SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.1-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.1-FINAL-SOURCE
          path: |
            SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
