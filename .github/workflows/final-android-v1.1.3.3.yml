name: Final E-SISWA Android v1.1.3.3

on:
  workflow_dispatch:
  push:
    branches: [ v1.1.3.3-student-print-notify ]
    paths:
      - '.github/workflows/final-android-v1.1.3.3.yml'
      - 'revision-assets/v1133-student-print-notify.patch.gz.b64'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.2 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3.2-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35065722784

      - name: Prepare v1.1.3.3 from v1.1.3.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='base-artifact/E-SISWA-SSD-Android-v1.1.3.2-SOURCE-CI.zip'
          PATCH_B64='revision-assets/v1133-student-print-notify.patch.gz.b64'
          PATCH='/tmp/v1133-student-print-notify.patch'
          test -s "$BASE"
          test -s "$PATCH_B64"
          echo 'bf3e27f984b1a30b5b1f82db7cbd95328c9a7c941b4ea2c578ead1f1124745af  base-artifact/E-SISWA-SSD-Android-v1.1.3.2-SOURCE-CI.zip' | sha256sum -c -
          base64 -d "$PATCH_B64" | gunzip > "$PATCH"
          echo '57d4659854852caa6394d93d57c992c46bf7d0e04b5c3f16964200717bfc87a4  /tmp/v1133-student-print-notify.patch' | sha256sum -c -
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          cd project
          patch -p1 < "$PATCH"
          python3 tools/test_v1133_student_print_notifications.py
          python3 tools/test_v1132_native_print_v2.py
          python3 tools/test_v1131_camera_print.py
          python3 tools/test_v112_permissions.py
          python3 tools/test_v113_ui.py
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 tools/verify_project.py
          python3 -m py_compile tools/*.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='8' versionName='1.1.3.3'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          find project -type d -name __pycache__ -prune -exec rm -rf {} +
          cd project
          zip -qr ../E-SISWA-SSD-Android-v1.1.3.3-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*' '__pycache__/*' '*/__pycache__/*'
          cd ..
          unzip -t E-SISWA-SSD-Android-v1.1.3.3-SOURCE-CI.zip >/dev/null
          if unzip -Z1 E-SISWA-SSD-Android-v1.1.3.3-SOURCE-CI.zip | grep -q '__pycache__'; then echo 'ERROR: pycache in source artifact'; exit 1; fi
          sha256sum E-SISWA-SSD-Android-v1.1.3.3-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3.3-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3.3-FINAL-SOURCE
          path: |
            E-SISWA-SSD-Android-v1.1.3.3-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
