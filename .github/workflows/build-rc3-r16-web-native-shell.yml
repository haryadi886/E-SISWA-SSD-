name: Build E-SISWA R7 RC.3 R16 Web Native Shell APK

on:
  push:
    branches:
      - 'build/rc3-r16-web-native-shell'
    paths:
      - '.github/workflows/build-rc3-r16-web-native-shell.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated RC.3 build branch
        uses: actions/checkout@v4

      - name: Download verified RC.2 R6 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-RC.2-C1.5.3.2-R6-APK-UJI
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 40285875794

      - name: Reconstruct RC.2 source and apply RC.3 R16 version delta
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-RC.2-C1.5.3.2-R6-SOURCE.zip' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          mkdir project
          unzip -q "$SRC" -d project
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          gradle = Path('project/app/build.gradle')
          s = gradle.read_text()
          assert s.count('versionCode 28') == 1, 'Expected verified RC.2 versionCode 28'
          assert s.count("versionName 'RC.2'") == 1, 'Expected verified RC.2 versionName'
          gradle.write_text(s.replace('versionCode 28', 'versionCode 29', 1).replace("versionName 'RC.2'", "versionName 'RC.3'", 1))

          main = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s = main.read_text()
          expected_url = 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbyBy0SGP9IBl_lm1-7AICQoCP3kFZGdKsShYCcVoxRC_9thKJ88H9U9Q-qJ8c0nj74ExQ/exec?page=login'
          assert expected_url in s, 'RC.2 source does not point to the requested R16 deployment'
          required = [
              'enforceLoginSystemFirst(view);',
              "view:'notification_center'",
              'DownloadBridge',
              'PrintBridge',
              'shouldOverrideUrlLoading',
              'openExternal(uri)',
              'saveDownloadedBytes',
              'installNativePrintBridge(view)',
              'deliverCachedFcmTokenToPage();',
              'deliverPendingPushOpenToPage();',
          ]
          for token in required:
              assert token in s, f'Missing native-shell contract: {token}'

          service = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java').read_text()
          manifest = Path('project/app/src/main/AndroidManifest.xml').read_text()
          assert 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' in service
          assert 'android:resource="@drawable/esiswa_notification_monochrome"' in manifest
          assert 'com.google.firebase.MESSAGING_EVENT' in manifest
          assert Path('project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png').is_file()
          print('PASS: source derived from verified RC.2 R6 artifact')
          print('PASS: version RC.3 / code 29')
          print('PASS: requested R16 Web deployment URL')
          print('PASS: FCM, badge mirror, Login-System-first, PrintBridge, DownloadBridge and external-link routing retained')
          print('MainActivity SHA-256:', hashlib.sha256(main.read_bytes()).hexdigest())
          PY

      - name: Verify source contract and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F 'versionCode 29' project/app/build.gradle
          grep -F "versionName 'RC.3'" project/app/build.gradle
          grep -F 'versionName' project/app/build.gradle
          grep -F 'enforceLoginSystemFirst(view);' project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "view:'notification_center'" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/esiswa_notification_monochrome"' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/app/src/main/AndroidManifest.xml')
          print('PASS: Android manifest XML parses')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile RC.3 debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity, integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='29' versionName='RC.3'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" E-SISWA-R7-RC.3-R16-WEB-APK-UJI.apk
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-RC.3-R16-WEB-NATIVE-SHELL-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-RC.3-R16-WEB-NATIVE-SHELL-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-RC.3-R16-WEB-NATIVE-SHELL-SOURCE.zip | tee source-sha256.txt

      - name: Upload RC.3 APK and verified source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-RC.3-R16-WEB-APK-UJI
          path: |
            E-SISWA-R7-RC.3-R16-WEB-APK-UJI.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            E-SISWA-R7-ANDROID-RC.3-R16-WEB-NATIVE-SHELL-SOURCE.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
