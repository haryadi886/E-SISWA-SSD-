name: Build E-SISWA Android v1.1.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android-v1.1.2.yml'
      - 'source-v112/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified v1.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="6bb9035a3185069cd5d1d31067ceb10d765f521d5211ac4c6f4989861677c456"

          cat > chunk-sha256.txt <<'EOF'
          e511cbf8f5e38869f7312459580360fd4b47777959d5451afdf29608b30945c8  source-v112/part00.b64
          52659a872f0f2c4ac52f9ae6948314cc59d6260934e75f196cf1a2bb81af96d8  source-v112/part01.b64
          885fb6c230064179ad4feceee1a09af84bc2f65d90d947bddee1473d84e6b7e2  source-v112/part02.b64
          13d55d2e53f1dfb5444e67e23f179b96bacbaa62a9ae0631bceecda294473235  source-v112/part03-00.b64
          0b884dbb49aba33aa431c0009d62113bb8942a8de0950df68573572dc66a9d52  source-v112/part03-01.b64
          2726dec5d726d74376e6b82bcd78bbd681e1005f36b21c75c1f56b12d3739281  source-v112/part03-02.b64
          3783575d3da8d23f1e7bdee42cd4fc16620d38889ff466a94fd6ebb19607d695  source-v112/part03-03.b64
          0868fd54e4aeec7f0cc90c9199d7fe336202c6027f3cb755ad4774df51b6fda8  source-v112/part04.b64
          435084846555272db31e088e5823366876eb302494f1b15839f6b8aaf28641c6  source-v112/part05-00.b64
          5b4e1207adf91715f375b783fa635d51196ecf937c326f6af69b614786cfa73f  source-v112/part05-01.b64
          34cba9040839f25a2c449f54d7861819fd63a00219d27d39170671ca36c8dbab  source-v112/part05-02.b64
          da62d327117016d423e01211a29fbb870ee9efb6b099e4ef1b5f2df728653bec  source-v112/part05-03.b64
          EOF
          sed -i 's/^          //' chunk-sha256.txt
          sha256sum -c chunk-sha256.txt

          rm -rf project source-v1.1.2.zip
          {
            cat source-v112/part00.b64
            cat source-v112/part01.b64
            cat source-v112/part02.b64
            cat source-v112/part03-00.b64
            cat source-v112/part03-01.b64
            cat source-v112/part03-02.b64
            cat source-v112/part03-03.b64
            cat source-v112/part04.b64
            cat source-v112/part05-00.b64
            cat source-v112/part05-01.b64
            cat source-v112/part05-02.b64
            cat source-v112/part05-03.b64
          } | tr -d '\n\r' | base64 -d > source-v1.1.2.zip
          echo "$EXPECTED_SHA  source-v1.1.2.zip" | sha256sum -c -
          unzip -t source-v1.1.2.zip >/dev/null
          mkdir project
          unzip -q source-v1.1.2.zip -d project
          test -f project/app/build.gradle
          test -f project/tools/test_v112_permissions.py
          test -f project/tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36|build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run v1.1.2 permission regression tests
        working-directory: project
        run: python3 tools/test_v112_permissions.py

      - name: Verify project contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Verify camera bridge security contract
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          MAIN="app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java"
          grep -q -- '-script.googleusercontent.com' "$MAIN"
          grep -q 'RESOURCE_VIDEO_CAPTURE' "$MAIN"
          ! grep -q 'RESOURCE_AUDIO_CAPTURE' "$MAIN"
          grep -q 'ACTION_APPLICATION_DETAILS_SETTINGS' "$MAIN"
          grep -q 'shouldShowRequestPermissionRationale(Manifest.permission.CAMERA)' "$MAIN"
          grep -q 'shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)' "$MAIN"

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity, signing and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$AAPT" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='4' versionName='1.1.2'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-source
          path: source-v1.1.2.zip
          if-no-files-found: error
          retention-days: 30
