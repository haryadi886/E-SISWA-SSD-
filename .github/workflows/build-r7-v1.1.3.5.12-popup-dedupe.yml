name: Build E-SISWA R7 Android v1.1.3.5.12 Duplicate Popup Guard

on:
  workflow_dispatch:
  push:
    branches: [ feature/r7-v113512-popup-dedupe ]
    paths:
      - '.github/workflows/build-r7-v1.1.3.5.12-popup-dedupe.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact v1.1.3.5.11 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.11-BALANCED-ICON-BUILD
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 36675406370

      - name: Extract and verify v1.1.3.5.11 baseline
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.11-SOURCE.zip' | head -n 1)"
          test -n "$SRC" && test -s "$SRC"
          rm -rf project
          mkdir project
          unzip -q "$SRC" -d project
          grep -F "versionCode 21" project/app/build.gradle
          grep -F "versionName '1.1.3.5.11'" project/app/build.gradle
          grep -F 'setNumber(1)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:insetLeft="10dp"' project/app/src/main/res/drawable/ic_launcher_foreground.xml
          find project/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > baseline-production.sha256

      - name: Apply Patch B and bump Android version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project")
          build = root / "app/build.gradle"
          s = build.read_text()
          assert "versionCode 21" in s and "versionName '1.1.3.5.11'" in s
          s = s.replace("versionCode 21", "versionCode 22", 1)
          s = s.replace("versionName '1.1.3.5.11'", "versionName '1.1.3.5.12'", 1)
          build.write_text(s)

          p = root / "app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java"
          s = p.read_text()
          assert "private static final String KEY_TOKEN = \"fcm_token\";" in s
          assert "if (shouldSuppressDuplicatePopup(context, title, body)) return;" not in s
          s = s.replace(
              "import java.util.Map;",
              "import java.util.Map;\nimport java.util.Locale;\nimport java.security.MessageDigest;\nimport java.nio.charset.StandardCharsets;",
              1
          )
          s = s.replace(
              '    private static final String KEY_TOKEN = "fcm_token";',
              '    private static final String KEY_TOKEN = "fcm_token";\n'
              '    private static final String KEY_POPUP_DEDUPE_PREFIX = "popup_seen_";\n'
              '    private static final long DUPLICATE_WINDOW_MS = 10L * 60L * 1000L;',
              1
          )
          permission_check = '''        if (Build.VERSION.SDK_INT >= 33
                  && context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
              return;
          }
'''
          assert permission_check in s
          s = s.replace(
              permission_check,
              permission_check + "        if (shouldSuppressDuplicatePopup(context, title, body)) return;\n",
              1
          )
          marker = "    private static String channelFor(String kind) {"
          assert marker in s
          methods = r'''    /** Suppress identical title/body popups for 10 minutes on this device. */
    static boolean shouldSuppressDuplicatePopup(Context context, String title, String body) {
        if (context == null) return false;
        long now = System.currentTimeMillis();
        SharedPreferences prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
        String key = KEY_POPUP_DEDUPE_PREFIX + popupFingerprint(title, body);
        long previous = prefs.getLong(key, 0L);

        // A backwards clock change should fail safe: do not show a duplicate early.
        if (previous > 0L && (now < previous || now - previous < DUPLICATE_WINDOW_MS)) {
            return true;
        }

        SharedPreferences.Editor edit = prefs.edit();
        for (Map.Entry<String, ?> entry : prefs.getAll().entrySet()) {
            if (!entry.getKey().startsWith(KEY_POPUP_DEDUPE_PREFIX)) continue;
            Object value = entry.getValue();
            if (!(value instanceof Long)) {
                edit.remove(entry.getKey());
                continue;
            }
            long timestamp = (Long) value;
            if (now >= timestamp && now - timestamp >= DUPLICATE_WINDOW_MS) {
                edit.remove(entry.getKey());
            }
        }
        edit.putLong(key, now).apply();
        return false;
    }

    private static String popupFingerprint(String title, String body) {
        String normalized = normalizeForDedupe(title) + "\n" + normalizeForDedupe(body);
        try {
            byte[] digest = MessageDigest.getInstance("SHA-256")
                    .digest(normalized.getBytes(StandardCharsets.UTF_8));
            StringBuilder out = new StringBuilder(digest.length * 2);
            for (byte b : digest) out.append(String.format(Locale.ROOT, "%02x", b & 0xff));
            return out.toString();
        } catch (Exception ignored) {
            // Stable fallback still avoids storing the raw title/body in preferences.
            return Integer.toHexString(normalized.hashCode());
        }
    }

    private static String normalizeForDedupe(String value) {
        String text = value == null ? "" : value.trim().replaceAll("\\s+", " ");
        return text.toLowerCase(Locale.ROOT);
    }

'''
          s = s.replace(marker, methods + marker, 1)
          p.write_text(s)
          PY

      - name: Run Patch B regression checks and verify scoped changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("project")
          build = (root / "app/build.gradle").read_text()
          main = (root / "app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java").read_text()
          checks = {
              "versionCode 22": "versionCode 22" in build,
              "versionName 1.1.3.5.12": "versionName '1.1.3.5.12'" in build,
              "10-minute interval": "10L * 60L * 1000L" in main,
              "persistent device-local preferences": 'getSharedPreferences(PREFS, Context.MODE_PRIVATE)' in main,
              "title/body fingerprint": 'normalizeForDedupe(title) + "\\n" + normalizeForDedupe(body)' in main,
              "SHA-256 fingerprint": 'MessageDigest.getInstance("SHA-256")' in main,
              "duplicate suppression before notify": main.index("shouldSuppressDuplicatePopup(context, title, body)") < main.index("nm.notify(id, notification)"),
              "existing FCM service retained": "extends FirebaseMessagingService" in main and "onMessageReceived(RemoteMessage message)" in main,
              "existing notification badge retained": ".setNumber(1)" in main,
              "existing channels retained": "CHANNEL_ATTENDANCE" in main and "CHANNEL_COACHING" in main and "CHANNEL_GENERAL" in main,
              "token persistence retained": "storeToken(this, token)" in main and 'putString(KEY_TOKEN, token.trim())' in main,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " - " + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Regression checks failed: " + ", ".join(failed))
          PY
          find project/app/src/main -type f -print0 | sort -z | xargs -0 sha256sum > candidate-production.sha256
          python3 - <<'PY'
          from pathlib import Path
          def read(path):
              result = {}
              for line in Path(path).read_text().splitlines():
                  h, p = line.split(None, 1)
                  result[p.strip()] = h
              return result
          before, after = read("baseline-production.sha256"), read("candidate-production.sha256")
          changed = sorted(p for p in set(before) | set(after) if before.get(p) != after.get(p))
          print("Changed production files:", changed)
          allowed = {
              "project/app/build.gradle",
              "project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java",
          }
          # Hash list paths are relative to project/app/src/main, so check source changes separately below.
          src_before = {k.replace("project/", ""): v for k, v in before.items()}
          src_after = {k.replace("project/", ""): v for k, v in after.items()}
          changed_src = sorted(p for p in set(src_before) | set(src_after) if src_before.get(p) != src_after.get(p))
          allowed_src = {"java/id/sch/smpn4dumai/esiswa/PushMessagingService.java"}
          print("Changed app/src/main files:", changed_src)
          if set(changed_src) != allowed_src:
              raise SystemExit("Unexpected production source changes: " + repr(changed_src))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK, release APK, and AAB
        working-directory: project
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK identity, signing, integrity, and package source
        shell: bash
        run: |
          set -euo pipefail
          DBG=project/app/build/outputs/apk/debug/app-debug.apk
          REL=project/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$DBG" && test -s "$REL" && test -s "$AAB"
          unzip -t "$DBG" >/dev/null
          unzip -t "$REL" >/dev/null
          unzip -t "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DBG" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='22' versionName='1.1.3.5.12'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DBG" | tee debug-apk-signature.txt
          cp "$DBG" E-SISWA-R7-v1.1.3.5.12-PATCH-B-APK-UJI.apk
          cp "$REL" E-SISWA-R7-v1.1.3.5.12-RELEASE-UNSIGNED.apk
          cp "$AAB" E-SISWA-R7-v1.1.3.5.12-PLAY-UNSIGNED.aab
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-v1.1.3.5.12-PATCH-B-APK-UJI.apk E-SISWA-R7-v1.1.3.5.12-RELEASE-UNSIGNED.apk E-SISWA-R7-v1.1.3.5.12-PLAY-UNSIGNED.aab E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip | tee SHA256-v113512.txt

      - name: Upload Patch B build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.12-PATCH-B-BUILD
          path: |
            E-SISWA-R7-v1.1.3.5.12-PATCH-B-APK-UJI.apk
            E-SISWA-R7-v1.1.3.5.12-RELEASE-UNSIGNED.apk
            E-SISWA-R7-v1.1.3.5.12-PLAY-UNSIGNED.aab
            E-SISWA-R7-ANDROID-v1.1.3.5.12-SOURCE.zip
            apk-badging.txt
            debug-apk-signature.txt
            SHA256-v113512.txt
          if-no-files-found: error
          retention-days: 30
