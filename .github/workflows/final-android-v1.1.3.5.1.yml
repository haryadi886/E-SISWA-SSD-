name: Final (SSD) SMPN4D Android v1.1.3.5.1

on:
  workflow_dispatch:
  push:
    branches: [ v1.1.3.5.1-branding ]
    paths:
      - '.github/workflows/final-android-v1.1.3.5.1.yml'
      - 'ci/patch/v1.1.3.5.1.part*'
      - 'ci/branding/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout v1.1.3.5.1 branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.3.5-FINAL-SOURCE
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35200944023

      - name: Prepare v1.1.3.5.1 source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(find base-artifact -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          test -n "$BASE" && test -s "$BASE"
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          cat ci/patch/v1.1.3.5.1.part* > /tmp/v1.1.3.5.1.patch
          cat ci/branding/logo.b64.part* | base64 -d > /tmp/esiswa_logo.webp
          cat ci/branding/splash.b64.part* | base64 -d > /tmp/launch_screen.jpg
          cd project
          patch -p1 < /tmp/v1.1.3.5.1.patch
          cp /tmp/esiswa_logo.webp app/src/main/res/drawable-nodpi/esiswa_logo.webp
          cp /tmp/launch_screen.jpg app/src/main/res/drawable-nodpi/launch_screen.jpg
          python3 tools/test_v112_permissions.py
          python3 tools/test_v113_ui.py
          python3 tools/test_v1131_camera_print.py
          python3 tools/test_v1132_native_print_v2.py
          python3 tools/test_v1133_student_print_notifications.py
          python3 tools/test_v1134_push_diagnostics.py
          python3 tools/test_v1135_print_state.py
          python3 tools/test_v11351_branding.py
          rm -rf tools/__pycache__
          python3 tools/verify_project.py

      - name: Audit branding assets
        shell: bash
        run: |
          set -euo pipefail
          grep -F '<string name="app_name">(SSD) SMPN4D</string>' project/app/src/main/res/values/strings.xml
          grep -F "versionName '1.1.3.5.1'" project/app/build.gradle
          grep -F 'versionCode 11' project/app/build.gradle
          test "$(sha256sum project/app/src/main/res/drawable-nodpi/esiswa_logo.webp | cut -d' ' -f1)" = "3b3ac02dbf72db512c286d29e33fd7810b72bd75862ab728f70fac581942d244"
          test "$(sha256sum project/app/src/main/res/drawable-nodpi/launch_screen.jpg | cut -d' ' -f1)" = "3758a133ae2bffb6eb3bb5170323e6f5609cf7c497d364cef60e81013dc93a80"
          file project/app/src/main/res/drawable-nodpi/esiswa_logo.webp
          file project/app/src/main/res/drawable-nodpi/launch_screen.jpg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='11' versionName='1.1.3.5.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "application-label:'(SSD) SMPN4D'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*' 'tools/__pycache__/*'
          cd ..
          unzip -t SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip >/dev/null
          sha256sum SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.1-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload final source
        uses: actions/upload-artifact@v4
        with:
          name: SSD-SMPN4D-v1.1.3.5.1-FINAL-SOURCE
          path: |
            SSD-SMPN4D-Android-v1.1.3.5.1-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
