name: Final E-SISWA Android v1.1.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/final-android-v1.1.2.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.1.1 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.1-source
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 35048986875

      - name: Prepare v1.1.2 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='base-artifact/E-SISWA-SSD-Android-v1.1.1-SOURCE-CI.zip'
          test -s "$BASE"
          echo 'dddc67f778b4363dfc2b075501dfff9780fae8dbe33b269e18072c6fe7660ea8  base-artifact/E-SISWA-SSD-Android-v1.1.1-SOURCE-CI.zip' | sha256sum -c -
          unzip -t "$BASE" >/dev/null
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          cd project

          python3 - <<'PY'
          from pathlib import Path

          build=Path('app/build.gradle')
          s=build.read_text()
          assert 'versionCode 3' in s and "versionName '1.1.1'" in s
          s=s.replace('versionCode 3','versionCode 4',1).replace("versionName '1.1.1'","versionName '1.1.2'",1)
          build.write_text(s)

          p=Path('app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s=p.read_text()
          old='import android.app.Activity;\nimport android.app.Dialog;'
          assert old in s
          s=s.replace(old,'import android.app.Activity;\nimport android.app.AlertDialog;\nimport android.app.Dialog;',1)

          oldhost='                || host.endsWith(".script.googleusercontent.com");'
          assert s.count(oldhost)==2, s.count(oldhost)
          s=s.replace(oldhost,'                || host.endsWith(".script.googleusercontent.com")\n                || host.endsWith("-script.googleusercontent.com");')

          marker='    private void refreshFcmToken() {'
          assert marker in s
          dialog='''    private void showPermissionSettingsDialog(String title, String message) {\n        if (isFinishing()) return;\n        new AlertDialog.Builder(this)\n                .setTitle(title)\n                .setMessage(message)\n                .setNegativeButton("Nanti", null)\n                .setPositiveButton("Buka Pengaturan", (dialog, which) -> {\n                    try {\n                        Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);\n                        intent.setData(Uri.parse("package:" + getPackageName()));\n                        startActivity(intent);\n                    } catch (Exception ignored) {\n                        toast("Pengaturan aplikasi tidak dapat dibuka.");\n                    }\n                })\n                .show();\n    }\n\n'''
          s=s.replace(marker,dialog+marker,1)

          oldcam='''                } else {\n                    req.deny();\n                    toast("Izin kamera diperlukan untuk QR/Face Recognition.");\n                }\n'''
          newcam='''                } else {\n                    req.deny();\n                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M\n                            && !shouldShowRequestPermissionRationale(Manifest.permission.CAMERA)) {\n                        showPermissionSettingsDialog(\n                                "Izin Kamera Diperlukan",\n                                "Aktifkan izin Kamera untuk E-SISWA agar Scan QR, Face Recognition, foto profil guru, dan foto siswa dapat digunakan."\n                        );\n                    } else {\n                        toast("Izin kamera diperlukan. Tekan Coba Lagi lalu pilih Izinkan.");\n                    }\n                }\n'''
          assert oldcam in s
          s=s.replace(oldcam,newcam,1)

          oldnotif='''        } else if (requestCode == REQ_NOTIFICATIONS) {\n            if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n                toast("Notifikasi Android dinonaktifkan. Anda dapat mengaktifkannya dari Pengaturan aplikasi.");\n            } else {\n                refreshFcmToken();\n            }\n'''
          newnotif='''        } else if (requestCode == REQ_NOTIFICATIONS) {\n            if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n                if (Build.VERSION.SDK_INT >= 33\n                        && !shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)) {\n                    showPermissionSettingsDialog(\n                            "Izin Notifikasi Diperlukan",\n                            "Aktifkan notifikasi E-SISWA agar pemberitahuan Pembinaan dan Absensi Masuk/Pulang dapat diterima di perangkat ini."\n                    );\n                } else {\n                    toast("Notifikasi belum diizinkan. Izin dapat diberikan saat diminta kembali.");\n                }\n            } else {\n                refreshFcmToken();\n            }\n'''
          assert oldnotif in s
          s=s.replace(oldnotif,newnotif,1)
          p.write_text(s)

          verify=Path('tools/verify_project.py')
          v=verify.read_text()
          v=v.replace("versionName '1.1.1'","versionName '1.1.2'")
          v=v.replace('v1.1.1 project contract satisfied','v1.1.2 project contract satisfied')
          verify.write_text(v)

          Path('tools/test_v112_permissions.py').write_text('''from pathlib import Path\nimport sys\nr=Path(__file__).resolve().parents[1]\nm=(r/'app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java').read_text()\nmf=(r/'app/src/main/AndroidManifest.xml').read_text()\nb=(r/'app/build.gradle').read_text()\nc={\n"Version 1.1.2":"versionName '1.1.2'" in b and 'versionCode 4' in b,\n"Camera manifest permission":'android.permission.CAMERA' in mf,\n"Notification manifest permission":'android.permission.POST_NOTIFICATIONS' in mf,\n"Apps Script sandbox origin":'host.endsWith("-script.googleusercontent.com")' in m,\n"Notification runtime request":'requestNotificationPermissionIfNeeded();' in m,\n"Camera runtime request":'requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA)' in m,\n"Settings recovery":'showPermissionSettingsDialog' in m and 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' in m,\n"Camera rationale":'shouldShowRequestPermissionRationale(Manifest.permission.CAMERA)' in m,\n"Notification rationale":'shouldShowRequestPermissionRationale(Manifest.permission.POST_NOTIFICATIONS)' in m,\n"Video-only WebView grant":'request.grant(new String[]{PermissionRequest.RESOURCE_VIDEO_CAPTURE})' in m,\n"No microphone grant":'RESOURCE_AUDIO_CAPTURE' not in m,\n}\nfor k,v in c.items(): print(('PASS' if v else 'FAIL')+' - '+k)\nf=[k for k,v in c.items() if not v]\nprint(f'PASS {len(c)-len(f)}/{len(c)} checks')\nsys.exit(1 if f else 0)\n''')
          PY

          echo '571e8d54ccb0f02f41d228d33cb65314dd7785f9dba56bb1f0834f32bb13353b  app/src/main/res/drawable-nodpi/launch_screen.jpg' | sha256sum -c -
          echo '2bdad684be125295f1cc59d45a8ba14d8bd7cd3522b279d94304e15a768ccad3  app/src/main/res/drawable-nodpi/esiswa_logo.webp' | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Permission regression tests
        working-directory: project
        run: python3 tools/test_v112_permissions.py

      - name: Project contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='4' versionName='1.1.2'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Package verified source
        shell: bash
        run: |
          cd project
          zip -qr ../E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip >/dev/null
          sha256sum E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip | tee source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-FINAL-APK
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.2-FINAL-SOURCE
          path: |
            E-SISWA-SSD-Android-v1.1.2-SOURCE-CI.zip
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
