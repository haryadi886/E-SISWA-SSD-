name: Build E-SISWA Android v1.1.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android-v1.1.0.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'app/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Android source package safely
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="f1f5ae9ef57a2d57181bec27ebfba1963b70c192"
          EXPECTED_SHA="1ad52bdab2bca8a90d517e29978b2d1d2dce2c921985fd6fa2fff4d687b19ce5"

          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          rm -rf project source.zip
          : > source.zip

          for part in \
            source.b64.part00 \
            source.b64.part01 \
            source.b64.part02 \
            rest.b64.part00 \
            rest.b64.part01 \
            rest.b64.part02 \
            rest.b64.part03 \
            rest.b64.part04 \
            rest.b64.part05
          do
            echo "Restoring $part"
            git show "$SOURCE_COMMIT:source-parts/$part" | base64 --decode >> source.zip
          done

          echo "$EXPECTED_SHA  source.zip" | sha256sum -c -
          mkdir project
          unzip -q source.zip -d project
          test -f project/app/build.gradle
          test -f project/tools/verify_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source contract
        working-directory: project
        run: python3 tools/verify_project.py

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-SSD-v1.1.0-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
