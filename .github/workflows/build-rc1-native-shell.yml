name: Build E-SISWA RC.1.0 Native Shell Secure Runtime

on:
  workflow_dispatch:
  push:
    branches: [ feature/rc1-native-shell-secure-runtime ]
    paths:
      - '.github/workflows/build-rc1-native-shell.yml'
      - 'revision-assets/rc1-native-shell/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact v1.1.3.5.9 verified source
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.9-ETAMU-COMBO-BUILD
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 36596576558

      - name: Extract verified Android baseline
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.9-ETAMU-COMBO-SOURCE.zip' | head -n 1)"
          test -n "$SRC" && test -s "$SRC"
          rm -rf project
          mkdir project
          unzip -q "$SRC" -d project
          grep -F "versionCode 19" project/app/build.gradle
          grep -F "versionName '1.1.3.5.9'" project/app/build.gradle
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F "AKfycbwkTSTL8b7A1DsRA-t79v1dheMq0BSQ0PYq_DtSd6dAlaSHAOEeGFSBaPZ7_6Bf1h3jAg" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java

      - name: Reconstruct and apply Native Android Shell + Secure Web Runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-shell-assets
          cat revision-assets/rc1-native-shell/part*.b64 | base64 -d > /tmp/native-shell-assets.tar.gz
          tar -xzf /tmp/native-shell-assets.tar.gz -C /tmp/native-shell-assets
          test -s /tmp/native-shell-assets/rc1-native-shell/native-shell-rc1.patch
          test -s /tmp/native-shell-assets/rc1-native-shell/test_native_shell_rc1.py
          base64 -d revision-assets/rc1-native-shell/native-push-fix2.patch.gz.b64 | gzip -d > /tmp/native-push-fix2.patch
          test -s /tmp/native-push-fix2.patch
          mkdir -p /tmp/notification-icon-fix4
          base64 -d revision-assets/rc1-native-shell/notification-icon-fix4.tar.gz.b64 > /tmp/notification-icon-fix4.tar.gz
          tar -xzf /tmp/notification-icon-fix4.tar.gz -C /tmp/notification-icon-fix4
          test -s /tmp/notification-icon-fix4/drawable-mdpi/ic_stat_notification.png
          test -s /tmp/notification-icon-fix4/drawable-xxxhdpi/ic_stat_notification.png
          cd project
          patch --batch -p1 < /tmp/native-shell-assets/rc1-native-shell/native-shell-rc1.patch
          cd ..
          python3 /tmp/native-shell-assets/rc1-native-shell/test_native_shell_rc1.py project
          cd project
          patch --batch -p1 < ../revision-assets/rc1-native-shell/network-ssl-fix.patch
          patch --batch -p1 < /tmp/native-push-fix2.patch
          sed -i "s/versionCode 22/versionCode 24/" app/build.gradle
          rm -f app/src/main/res/drawable/ic_stat_notification.xml
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            mkdir -p "app/src/main/res/$d"
            cp "/tmp/notification-icon-fix4/$d/ic_stat_notification.png" "app/src/main/res/$d/ic_stat_notification.png"
          done
          cd ..
          grep -F "versionCode 24" project/app/build.gradle
          grep -F "versionName 'RC.1.0'" project/app/build.gradle
          grep -F "TRANSPORT_WIFI" project/app/src/main/java/id/sch/smpn4dumai/esiswa/NetworkMonitor.java
          ! grep -F "NET_CAPABILITY_VALIDATED" project/app/src/main/java/id/sch/smpn4dumai/esiswa/NetworkMonitor.java
          grep -F "mainStillFailed" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "scheduleNativePushRepair" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "setAutoInitEnabled(true)" project/app/src/main/java/id/sch/smpn4dumai/esiswa/FirebaseBootstrap.java
          grep -F "setShowBadge(true)" project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F ".setSmallIcon(R.drawable.ic_stat_notification)" project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/ic_stat_notification"' project/app/src/main/AndroidManifest.xml
          test ! -e project/app/src/main/res/drawable/ic_stat_notification.xml
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            test -s "project/app/src/main/res/$d/ic_stat_notification.png"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and AAB
        working-directory: project
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Audit Native Shell build outputs
        shell: bash
        run: |
          set -euo pipefail
          DBG=project/app/build/outputs/apk/debug/app-debug.apk
          REL=project/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$DBG" && test -s "$REL" && test -s "$AAB"
          unzip -t "$DBG" >/dev/null
          unzip -t "$REL" >/dev/null
          unzip -t "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DBG" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='24' versionName='RC.1.0'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DBG" | tee debug-apk-signature.txt
          sed -e 's/versionCode 20/versionCode 24/g' -e 's/code20/code24/g' \
            /tmp/native-shell-assets/rc1-native-shell/test_native_shell_rc1.py > /tmp/test_native_shell_fix1.py
          python3 /tmp/test_native_shell_fix1.py project | tee native-shell-contract-audit.txt
          grep -F "TRANSPORT_WIFI" project/app/src/main/java/id/sch/smpn4dumai/esiswa/NetworkMonitor.java
          ! grep -F "NET_CAPABILITY_VALIDATED" project/app/src/main/java/id/sch/smpn4dumai/esiswa/NetworkMonitor.java
          grep -F "mainStillFailed" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          test ! -e project/app/src/main/res/drawable/ic_stat_notification.xml
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi; do
            test -s "project/app/src/main/res/$d/ic_stat_notification.png"
          done
          cp "$DBG" E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-APK-UJI.apk
          cp "$REL" E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-RELEASE-UNSIGNED.apk
          cp "$AAB" E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-PLAY-UNSIGNED.aab
          cd project
          zip -qr ../E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-SOURCE.zip >/dev/null
          sha256sum \
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-APK-UJI.apk \
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-RELEASE-UNSIGNED.apk \
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-PLAY-UNSIGNED.aab \
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-SOURCE.zip \
            | tee SHA256-E-SISWA-RC.1.0-NATIVE-SHELL-FIX4.txt

      - name: Upload Native Shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-BUILD
          path: |
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-APK-UJI.apk
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-RELEASE-UNSIGNED.apk
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-PLAY-UNSIGNED.aab
            E-SISWA-RC.1.0-NATIVE-SHELL-FIX4-SOURCE.zip
            apk-badging.txt
            debug-apk-signature.txt
            native-shell-contract-audit.txt
            SHA256-E-SISWA-RC.1.0-NATIVE-SHELL-FIX4.txt
          if-no-files-found: error
          retention-days: 30
