name: Build E-SISWA R7 v1.1.3.5.16 C1.5.3.2 APK (isolated candidate)

on:
  push:
    branches:
      - 'build/v1.1.3.5.16-c1.5.3.2'
    paths:
      - '.github/workflows/build-v1.1.3.5.16-c1.5.3.2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated test-build branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5.15 Android source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.15-C1.5.3.1-APK-UJI
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 38571479187

      - name: Reconstruct source and bump only Android build identity
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.15-C1.5.3.1-SOURCE.zip' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          echo '9695af6afc0cedffab00c380220aa3170deb2b197c98a96a2252eb99e56ca884  '"$SRC" | sha256sum -c -
          mkdir project
          unzip -q "$SRC" -d project

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          gradle = Path('project/app/build.gradle')
          s = gradle.read_text()
          old = "        versionCode 25\\n        versionName '1.1.3.5.15'"
          new = "        versionCode 26\\n        versionName '1.1.3.5.16'"
          assert s.count(old) == 1, 'Unexpected base Android version metadata'
          gradle.write_text(s.replace(old, new, 1))

          java = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          main = java.read_text()
          expected_url = 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbwkTSTL8b7A1DsRA-t79v1dheMq0BSQ0PYq_DtSd6dAlaSHAOEeGFSBaPZ7_6Bf1h3jAg/exec'
          assert expected_url in main, 'Expected E-SISWA production Web App URL not found; refusing to build against unknown endpoint'
          assert "view:'notification_center'" in main, 'Notification Center routing baseline missing'
          assert "kind:'general'" in main, 'Notification Center general notification mirror missing'

          service = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java').read_text()
          manifest = Path('project/app/src/main/AndroidManifest.xml').read_text()
          icon = Path('project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png')
          assert 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' in service, 'Native monochrome notification icon binding missing'
          assert 'android:resource="@drawable/esiswa_notification_monochrome"' in manifest, 'Manifest monochrome notification icon binding missing'
          assert icon.is_file() and icon.stat().st_size > 0, 'Monochrome notification icon asset missing'

          expected = {
              'project/app/build.gradle': 'VERSION_METADATA_UPDATED',
          }
          for name, marker in expected.items():
              assert marker == 'VERSION_METADATA_UPDATED'
          print('PASS: Android version bumped to 1.1.3.5.16 / code 26')
          print('PASS: production Web App URL preserved for current live web baseline')
          print('PASS: Notification Center routing and MONO notification icon preserved')
          PY

      - name: Verify source contract and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F 'versionCode 26' project/app/build.gradle
          grep -F "versionName '1.1.3.5.16'" project/app/build.gradle
          grep -F "view:'notification_center'" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/esiswa_notification_monochrome"' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/app/src/main/AndroidManifest.xml')
          print('PASS: Android manifest XML parses')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity, integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='26' versionName='1.1.3.5.16'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" E-SISWA-R7-v1.1.3.5.16-C1.5.3.2-APK-UJI.apk
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.16-C1.5.3.2-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.16-C1.5.3.2-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-v1.1.3.5.16-C1.5.3.2-SOURCE.zip | tee source-sha256.txt
          printf '%s\\n' 'Target web baseline: E-SISWA-C1.5.3.2-R6-PATCH-ADMIN-PULANG-MASSAL-PREVIEW-PERFORMANCE-FIX' > WEB-BASELINE.txt
          printf '%s\\n' 'The APK opens the configured live Google Apps Script deployment URL. Deploy the selected web baseline to that same URL before runtime tests.' >> WEB-BASELINE.txt

      - name: Upload verified APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.16-C1.5.3.2-APK-UJI
          path: |
            E-SISWA-R7-v1.1.3.5.16-C1.5.3.2-APK-UJI.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            E-SISWA-R7-ANDROID-v1.1.3.5.16-C1.5.3.2-SOURCE.zip
            source-sha256.txt
            WEB-BASELINE.txt
          if-no-files-found: error
          retention-days: 30
