name: Build E-SISWA R7 v1.1.3.5.17 C1.5.3.2 R6 Native Shell APK Uji

on:
  push:
    branches:
      - 'build/v1.1.3.5.17-c1.5.3.2-r6-url'
    paths:
      - '.github/workflows/build-v1.1.3.5.17-c1.5.3.2-r6-url.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated test-build branch
        uses: actions/checkout@v4

      - name: Download verified v1.1.3.5.16 source artifact
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.16-C1.5.3.2-APK-UJI
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 39093441574

      - name: Apply R6 Native Shell version and deployment URL
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.16-C1.5.3.2-SOURCE.zip' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          unzip -t "$SRC" >/dev/null
          mkdir project
          unzip -q "$SRC" -d project
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          gradle = Path('project/app/build.gradle')
          s = gradle.read_text()
          old = "versionCode 26"
          assert s.count(old) == 1, "Expected base versionCode 26"
          assert s.count("versionName '1.1.3.5.16'") == 1, "Expected base versionName 1.1.3.5.16"
          s = s.replace(old, "versionCode 27", 1).replace("versionName '1.1.3.5.16'", "versionName '1.1.3.5.17'", 1)
          gradle.write_text(s)

          java = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java')
          s = java.read_text()
          old_url = 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbwkTSTL8b7A1DsRA-t79v1dheMq0BSQ0PYq_DtSd6dAlaSHAOEeGFSBaPZ7_6Bf1h3jAg/exec'
          new_url = 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbyakrD5CIbaeZm7GH3jwn2ZGrpA_DBq6HYkOqLUaNI-g18L4GBzMctYVSYM7f9O7ZCzkQ/exec'
          assert s.count(old_url) == 1, 'Expected production URL was not found exactly once'
          s = s.replace(old_url, new_url, 1)
          assert "view:'notification_center'" in s, 'Notification Center routing baseline missing'
          java.write_text(s)

          service = Path('project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java').read_text()
          manifest = Path('project/app/src/main/AndroidManifest.xml').read_text()
          icon = Path('project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png')
          assert 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' in service
          assert 'android:resource="@drawable/esiswa_notification_monochrome"' in manifest
          assert icon.is_file() and icon.stat().st_size > 0
          assert new_url in java.read_text()
          print('PASS: version 1.1.3.5.17 / code 27')
          print('PASS: requested Google Apps Script START_URL')
          print('PASS: Notification Center routing and monochrome notification icon preserved')
          print('MainActivity SHA-256:', hashlib.sha256(java.read_bytes()).hexdigest())
          PY

      - name: Verify source contract and manifest
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F 'versionCode 27' project/app/build.gradle
          grep -F "versionName '1.1.3.5.17'" project/app/build.gradle
          grep -F 'https://script.google.com/a/macros/guru.smp.belajar.id/s/AKfycbyakrD5CIbaeZm7GH3jwn2ZGrpA_DBq6HYkOqLUaNI-g18L4GBzMctYVSYM7f9O7ZCzkQ/exec' project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F "view:'notification_center'" project/app/src/main/java/id/sch/smpn4dumai/esiswa/MainActivity.java
          grep -F 'setSmallIcon(R.drawable.esiswa_notification_monochrome)' project/app/src/main/java/id/sch/smpn4dumai/esiswa/PushMessagingService.java
          grep -F 'android:resource="@drawable/esiswa_notification_monochrome"' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/drawable-nodpi/esiswa_notification_monochrome.png
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('project/app/src/main/AndroidManifest.xml')
          print('PASS: Android manifest XML parses')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Audit APK identity, integrity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='27' versionName='1.1.3.5.17'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" E-SISWA-R7-v1.1.3.5.17-C1.5.3.2-R6-APK-UJI.apk
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.17-C1.5.3.2-R6-NATIVE-SHELL-SOURCE.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.17-C1.5.3.2-R6-NATIVE-SHELL-SOURCE.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-v1.1.3.5.17-C1.5.3.2-R6-NATIVE-SHELL-SOURCE.zip | tee source-sha256.txt
          printf '%s\n' 'Web baseline requested: E-SISWA-C1.5.3.2-R6-PATCH-ADMIN-PULANG-MASSAL-PREVIEW-PERFORMANCE-FIX-FULL-RUNTIME.zip' > WEB-BASELINE.txt
          printf '%s\n' 'Native Shell START_URL uses the deployment URL supplied by the user. Live deployment contents were not independently verified by this build workflow.' >> WEB-BASELINE.txt

      - name: Upload verified APK and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.17-C1.5.3.2-R6-APK-UJI
          path: |
            E-SISWA-R7-v1.1.3.5.17-C1.5.3.2-R6-APK-UJI.apk
            apk-badging.txt
            apk-signature.txt
            apk-sha256.txt
            E-SISWA-R7-ANDROID-v1.1.3.5.17-C1.5.3.2-R6-NATIVE-SHELL-SOURCE.zip
            source-sha256.txt
            WEB-BASELINE.txt
          if-no-files-found: error
          retention-days: 30
