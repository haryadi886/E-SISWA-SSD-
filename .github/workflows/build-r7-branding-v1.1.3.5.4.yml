name: Build E-SISWA R7 Branding v1.1.3.5.4

on:
  workflow_dispatch:
  push:
    branches: [ feature/r7-branding-v11354 ]
    paths:
      - '.github/workflows/build-r7-branding-v1.1.3.5.4.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v4

      - name: Download verified R7 v1.1.3.5.3 source
        uses: actions/download-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.3-BUILD
          path: base-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: haryadi886/E-SISWA-SSD-
          run-id: 36333267505

      - name: Extract verified R7 source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(find base-artifact -type f -name 'E-SISWA-R7-ANDROID-v1.1.3.5.3-SOURCE-CI.zip' | head -n 1)"
          test -n "$BASE" && test -s "$BASE"
          rm -rf project
          mkdir project
          unzip -q "$BASE" -d project
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" project/app/build.gradle
          grep -F "versionCode 13" project/app/build.gradle
          grep -F "versionName '1.1.3.5.3'" project/app/build.gradle

      - name: Reconstruct exact launcher and splash assets
        shell: bash
        run: |
          set -euo pipefail
          cat revision-assets/r7-branding/esiswa_logo.webp.b64.* | tr -d '\n\r' | base64 -d > project/app/src/main/res/drawable-nodpi/esiswa_logo.webp
          cat revision-assets/r7-branding/launch_screen.jpg.b64.* | tr -d '\n\r' | base64 -d > project/app/src/main/res/drawable-nodpi/launch_screen.jpg
          echo "91b8752ad5114f79a9111b6c6c68f2ba6610d1ae2819dc4f9a62e77d58ed8c36  project/app/src/main/res/drawable-nodpi/esiswa_logo.webp" | sha256sum -c -
          echo "0b8322ef4aada2014e601154f0218eba146e860b023df62f479e1f072c864508  project/app/src/main/res/drawable-nodpi/launch_screen.jpg" | sha256sum -c -
          file project/app/src/main/res/drawable-nodpi/esiswa_logo.webp
          file project/app/src/main/res/drawable-nodpi/launch_screen.jpg

      - name: Apply v1.1.3.5.4 branding patch
        shell: bash
        run: |
          set -euo pipefail
          cd project
          patch --batch -p1 < ../revision-assets/r7-branding-v11354.patch
          cp ../revision-assets/test_v11354_branding.py tools/test_v11354_branding.py

      - name: Deep audit all Android functions
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 tools/test_v112_permissions.py
          python3 tools/test_v113_ui.py
          python3 tools/test_v1131_camera_print.py
          python3 tools/test_v1132_native_print_v2.py
          python3 tools/test_v1133_student_print_notifications.py
          python3 tools/test_v1134_push_diagnostics.py
          python3 tools/test_v1135_print_state.py
          python3 tools/test_v11351_branding.py
          python3 tools/test_v11352_print_lightweight.py
          python3 tools/test_v11353_r7.py
          python3 tools/test_v11354_branding.py
          python3 tools/verify_project.py

      - name: Security and configuration audit
        shell: bash
        run: |
          set -euo pipefail
          cd project
          grep -F "applicationId 'id.sch.smpn4dumai.esiswa'" app/build.gradle
          grep -F "versionCode 14" app/build.gradle
          grep -F "versionName '1.1.3.5.4'" app/build.gradle
          grep -F "targetSdk 36" app/build.gradle
          grep -F "compileSdk 36" app/build.gradle
          grep -F "firebase-messaging" app/build.gradle
          grep -F "android.permission.CAMERA" app/src/main/AndroidManifest.xml
          grep -F "android.permission.POST_NOTIFICATIONS" app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -F '@drawable/launch_screen' app/src/main/res/layout/activity_main.xml
          grep -F '@drawable/esiswa_logo' app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -F 'android:insetLeft="18dp"' app/src/main/res/drawable/ic_launcher_foreground.xml
          ! grep -R --line-number --exclude='verify_project.py' --exclude='FIREBASE-PUSH-SETUP.md' --exclude='SECURITY-NOTES.md' 'BEGIN PRIVATE KEY' .
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' \) -print -quit | grep -q .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          S="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$S" ]; then S="$(command -v sdkmanager)"; fi
          yes | "$S" --licenses >/dev/null || true
          "$S" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK and Play AAB
        working-directory: project
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Audit APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          DBG=project/app/build/outputs/apk/debug/app-debug.apk
          REL=project/app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=project/app/build/outputs/bundle/release/app-release.aab
          test -s "$DBG" && test -s "$REL" && test -s "$AAB"
          unzip -t "$DBG" >/dev/null
          unzip -t "$REL" >/dev/null
          unzip -t "$AAB" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$DBG" | tee apk-badging.txt
          grep "package: name='id.sch.smpn4dumai.esiswa' versionCode='14' versionName='1.1.3.5.4'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DBG" | tee debug-apk-signature.txt
          unzip -l "$DBG" | grep -E 'esiswa_logo|launch_screen' | tee branding-apk-assets.txt
          sha256sum "$DBG" "$REL" "$AAB" | tee build-sha256.txt
          cp "$DBG" E-SISWA-R7-v1.1.3.5.4-DEBUG.apk
          cp "$REL" E-SISWA-R7-v1.1.3.5.4-RELEASE-UNSIGNED.apk
          cp "$AAB" E-SISWA-R7-v1.1.3.5.4-PLAY-UNSIGNED.aab
          cd project
          zip -qr ../E-SISWA-R7-ANDROID-v1.1.3.5.4-SOURCE-CI.zip . -x 'app/build/*' 'build/*' '.gradle/*'
          cd ..
          unzip -t E-SISWA-R7-ANDROID-v1.1.3.5.4-SOURCE-CI.zip >/dev/null
          sha256sum E-SISWA-R7-ANDROID-v1.1.3.5.4-SOURCE-CI.zip | tee source-sha256.txt

      - name: Upload branded R7 build
        uses: actions/upload-artifact@v4
        with:
          name: E-SISWA-R7-v1.1.3.5.4-BRANDING-BUILD
          path: |
            E-SISWA-R7-v1.1.3.5.4-DEBUG.apk
            E-SISWA-R7-v1.1.3.5.4-RELEASE-UNSIGNED.apk
            E-SISWA-R7-v1.1.3.5.4-PLAY-UNSIGNED.aab
            E-SISWA-R7-ANDROID-v1.1.3.5.4-SOURCE-CI.zip
            apk-badging.txt
            debug-apk-signature.txt
            branding-apk-assets.txt
            build-sha256.txt
            source-sha256.txt
          if-no-files-found: error
          retention-days: 30
